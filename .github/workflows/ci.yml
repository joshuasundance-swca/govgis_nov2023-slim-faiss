# python-version below is pinned to an EXACT patch (3.14.3), matching
# .python-version -- do not float this back to "3.14". Confirmed live
# 2026-07-21 (minimal repro: `gr.Blocks()` + `gr.Button().click(...)`,
# nothing else) that mypy 2.3.0 gives false "Button/Blocks/Textbox has no
# attribute click/load/submit" [attr-defined] errors on gradio 6.20.0 when
# running under CPython 3.14.5 or 3.14.6, but is clean under 3.14.3 -- a
# genuine Python-patch-sensitive mypy/typeshed interaction with Gradio's
# metaclass-based event-method generation, not a bug in this repo's code.
# Re-pin forward only after re-running that minimal repro against the new
# patch and confirming it's clean.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14.3"
          enable-cache: true
      - name: Install project (locked)
        run: uv sync --locked --all-groups
      - name: Run pytest
        run: uv run pytest

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14.3"
          enable-cache: true
      - name: Install project (locked)
        run: uv sync --locked --all-groups
      - name: Run ruff check
        run: uv run ruff check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14.3"
          enable-cache: true
      - name: Install project (locked)
        run: uv sync --locked --all-groups
      - name: Run mypy
        run: uv run mypy .

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14.3"
          enable-cache: true
      - name: Install project (locked)
        run: uv sync --locked --all-groups
      - name: Run pre-commit on all files
        run: uv run pre-commit run --all-files

  gr-html-safety:
    name: gr-html-safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14.3"
          enable-cache: true
      - name: Install project (locked)
        run: uv sync --locked --all-groups
      - name: Check gr.HTML is never bound to non-literal content
        run: uv run python scripts/check_gr_html_safety.py

  requirements-drift:
    name: requirements-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14.3"
          enable-cache: true
      # Regenerating in place (same -o target the committed file was produced
      # with) and diffing avoids a false failure from uv's autogenerated
      # header, which embeds the exact invocation (including -o) verbatim —
      # a temp-file comparison would fail on that alone, never on real drift.
      - name: Regenerate requirements.txt from uv.lock
        run: uv export --locked --no-dev --format requirements.txt -o requirements.txt
      - name: Fail if committed requirements.txt has drifted from uv.lock
        run: git diff --exit-code -- requirements.txt
