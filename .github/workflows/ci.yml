name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install project (locked)
        run: uv sync --locked --all-groups
      - name: Run pytest
        run: uv run pytest

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install project (locked)
        run: uv sync --locked --all-groups
      - name: Run ruff check
        run: uv run ruff check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install project (locked)
        run: uv sync --locked --all-groups
      - name: Run mypy
        run: uv run mypy .

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install project (locked)
        run: uv sync --locked --all-groups
      - name: Run pre-commit on all files
        run: uv run pre-commit run --all-files

  gr-html-safety:
    name: gr-html-safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install project (locked)
        run: uv sync --locked --all-groups
      - name: Check gr.HTML is never bound to non-literal content
        run: uv run python scripts/check_gr_html_safety.py

  requirements-drift:
    name: requirements-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      # Regenerating in place (same -o target the committed file was produced
      # with) and diffing avoids a false failure from uv's autogenerated
      # header, which embeds the exact invocation (including -o) verbatim —
      # a temp-file comparison would fail on that alone, never on real drift.
      - name: Regenerate requirements.txt from uv.lock
        run: uv export --locked --no-dev --format requirements.txt -o requirements.txt
      - name: Fail if committed requirements.txt has drifted from uv.lock
        run: git diff --exit-code -- requirements.txt
