# Don't know what this file is? See https://pre-commit.com/
#   pip install pre-commit
#   pre-commit install
#   pre-commit autoupdate
# Apply to all files without commiting:
#   pre-commit run --all-files
#   I recommend running this until you pass all checks, and then commit.
#   Fix what you need to and then let the pre-commit hooks resolve their conflicts.
#   You may need to git add -u between runs.
# docs/stage0/evidence holds raw, byte-exact captured build/run logs (see
# docs/stage0/baseline_timings.md) -- formatting hooks (end-of-file-fixer,
# trailing-whitespace, mixed-line-ending) must not silently rewrite them.
exclude: "^(AI_CHANGELOG\\.md|docs/stage0/evidence/)"
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-builtin-literals
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-case-conflict
      - id: check-added-large-files
      - id: check-json
      - id: debug-statements
      - id: fix-byte-order-marker
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
  - repo: local
    hooks:
      # "uv run" (not a hardcoded interpreter path) so this hook resolves the
      # project's own venv on any OS/CI runner without reinstalling
      # torch/faiss-cpu into a throwaway pre-commit env per run, the way
      # mirrors-mypy's isolated env would. pass_filenames is false and "."
      # is fixed on the command line -- mypy's `exclude` config (app.py,
      # docs/stage0 per pyproject.toml) only applies to mypy's own file
      # discovery, not to files passed as explicit CLI arguments, so a
      # pre-commit-supplied changed-file list would silently bypass it and
      # fail on files Stage 1 deliberately doesn't touch. This also keeps
      # the hook identical to CI's "mypy ." invocation.
      - id: mypy
        name: mypy (project venv via uv)
        entry: uv run --no-sync mypy .
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
  - repo: https://github.com/PyCQA/bandit
    rev: "1.9.4"
    hooks:
      # Same exclusion boundary as pyproject.toml's ruff/mypy config: app.py
      # is the legacy app Stage 1 deliberately doesn't touch (replaced in
      # Stage 3), and docs/stage0 is one-off tooling outside this project's
      # dependency set. Bandit has no exclude config of its own to inherit
      # this from, so it's stated here explicitly.
      - id: bandit
        exclude: ^(app\.py|docs/stage0/|tests/)
